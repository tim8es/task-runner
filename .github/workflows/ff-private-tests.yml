name: FF private job contract tests (synthetic data only)
on:
  pull_request:
    paths:
      - 'tests/test_ff_runner_contract.py'
      - '.github/workflows/ff-qwen-private.yml'
      - '.github/workflows/ff-private-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate only opaque dispatch and no public artifacts
        run: python -m unittest discover -s tests -p 'test_ff_runner_contract.py' -v