name: Font availability preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-font:
    runs-on: windows-2022
    steps:
      - name: Check Bahnschrift availability
        shell: pwsh
        run: |
          $fontPath = 'C:\Windows\Fonts\bahnschrift.ttf'
          Write-Output "Bahnschrift available: $(Test-Path -LiteralPath $fontPath)"
