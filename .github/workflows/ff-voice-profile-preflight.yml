name: FF private voice profile preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ff-voice-profile-preflight.yml'

# No permissions for the public task-runner repository.
permissions: {}

jobs:
  profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check required private credentials
        env:
          PRIVATE_TOKEN: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          JOB_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          UNIVERSAL_REGISTRY: ${{ secrets.TASK_RUNNER_REGISTRY }}
          UNIVERSAL_TOKEN: ${{ secrets.TASK_RUNNER_ACCESS_TOKEN }}
          UNIVERSAL_ENV_JSON: ${{ secrets.TASK_RUNNER_ENV_JSON }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo 'Missing VOICE_ENGINE_REPO_TOKEN'
            missing=1
          fi
          if [ -z "$JOB_KEY" ]; then
            echo 'Missing FF_JOB_FERNET_KEY'
            missing=1
          fi
          if [ -z "$UNIVERSAL_REGISTRY" ]; then
            echo 'Missing TASK_RUNNER_REGISTRY'
            missing=1
          fi
          if [ -z "$UNIVERSAL_TOKEN" ]; then
            echo 'Missing TASK_RUNNER_ACCESS_TOKEN'
            missing=1
          fi
          if ! python3 -c 'import json,os,sys; v=json.loads(os.environ.get("UNIVERSAL_ENV_JSON") or "{}"); sys.exit(0 if isinstance(v,dict) and all(isinstance(v.get(k),str) and bool(v.get(k)) for k in ("ff_voice_token","ff_job_fernet_key")) else 1)' >/dev/null 2>&1; then
            echo 'Missing FF private bindings in TASK_RUNNER_ENV_JSON'
            missing=1
          fi
          exit "$missing"

      - name: Check out pinned private Voice Engine checker
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/voice-engine
          ref: e75ba8375f11562b331f77855c8d536c7bed94cc
          token: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          path: private_code
          persist-credentials: false
          sparse-checkout: |
            scripts

      - name: Check out encrypted owner profile (data only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/voice-engine
          ref: main
          token: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          path: private_data
          persist-credentials: false
          sparse-checkout: |
            profiles

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify profile decryption without downloading Qwen
        env:
          FF_JOB_FERNET_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          PYTHONPATH: ${{ github.workspace }}/private_code
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=43,<48'
          if python -m scripts.private_worker --check-profile --private-root private_data >/dev/null 2>&1; then
            echo 'Reusable encrypted voice profile is accessible and decrypts'
          else
            echo 'Private voice profile is missing or key does not match'
            exit 1
          fi

      - name: Remove private files from runner
        if: always()
        run: rm -rf private_data private_code
