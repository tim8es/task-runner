name: Runner check

on:
  pull_request:
    paths:
      - '.github/workflows/render-short.yml'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check FFmpeg
        run: ffmpeg -version
