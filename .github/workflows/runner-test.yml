name: Runner test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check Altare reachability
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 --location https://n8n-altare.taile7cc1a.ts.net/ 2>/dev/null || true)"
          printf 'n8n_http_status=%s\n' "${status:-000}"

      - name: Get private renderer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: codex/shorts-github-cloud-migration
          path: task
          persist-credentials: false
          show-progress: false

      - name: Run synthetic render check
        env:
          OMNIROUTE_BASE_URL: https://subscript-dexterity-mutiny.ngrok-free.dev/v1
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: bash task/scripts/ci_render_probe.sh
