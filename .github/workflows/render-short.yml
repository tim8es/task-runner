name: Render private Shorts job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque n8n render job ID
        required: true
        type: string

permissions: {}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate private renderer revision
        env:
          PRIVATE_RENDERER_REF: ${{ secrets.PRIVATE_RENDERER_REF }}
        run: |
          if [[ ! "$PRIVATE_RENDERER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Private renderer revision is not configured"
            exit 1
          fi

      - name: Check out private renderer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/n8n-youtube-shorts-workflow
          ref: ${{ secrets.PRIVATE_RENDERER_REF }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: task
          persist-credentials: false
          show-progress: false

      - name: Install renderer dependencies
        id: install_renderer_dependencies
        timeout-minutes: 15
        run: |
          echo "Updating Ubuntu package indexes over IPv4"
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 -o Acquire::Retries=1 update
          echo "Installing renderer system packages"
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg python3-venv fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/shorts-venv"
          "$RUNNER_TEMP/shorts-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==13.0.0' 'edge-tts==7.3.1'

      - name: Report renderer setup failure to n8n
        if: ${{ always() && steps.install_renderer_dependencies.outcome != 'success' }}
        timeout-minutes: 2
        env:
          JOB_ID: ${{ inputs.job_id }}
          N8N_RENDER_CALLBACK_URL: https://n8n-altare.taile7cc1a.ts.net/webhook/shorts-render-callback
          N8N_RENDER_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          payload = json.dumps({
              "schemaVersion": 1,
              "jobId": os.environ["JOB_ID"],
              "status": "failed",
              "stage": "render",
              "errorType": "RunnerSetupFailed",
          }).encode("utf-8")
          for attempt in range(3):
              request = urllib.request.Request(
                  os.environ["N8N_RENDER_CALLBACK_URL"],
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "X-Job-ID": os.environ["JOB_ID"],
                      "X-Preview-Token": os.environ["N8N_RENDER_TOKEN"],
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError("setup_failure_callback_not_accepted")
                      print(json.dumps({"status": "reported", "httpStatus": response.status}))
                      break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(2)
          PY

      - name: Render and return the result to n8n
        working-directory: task
        env:
          JOB_ID: ${{ inputs.job_id }}
          N8N_RENDER_JOB_URL: https://n8n-altare.taile7cc1a.ts.net/webhook/shorts-render-job
          N8N_RENDER_CALLBACK_URL: https://n8n-altare.taile7cc1a.ts.net/webhook/shorts-render-callback
          N8N_RENDER_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
          OMNIROUTE_BASE_URL: https://subscript-dexterity-mutiny.ngrok-free.dev/v1
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VISUAL_REVIEW_MODEL: fast
          VISUAL_REVIEW_FALLBACK_MODELS: ollama-cloud/gemma4:31b
        run: "$RUNNER_TEMP/shorts-venv/bin/python -m scripts.github_render_worker"

