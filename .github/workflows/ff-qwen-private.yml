name: FF Qwen3 1.7B - private job on public CPU

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Opaque 32-character hex FF job ID; never paste audio or transcripts here'
        required: true
        type: string

# Never grant the public workflow write access to task-runner itself.
permissions: {}
concurrency:
  group: ff-qwen-private-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  voice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HOME: /tmp/ff-hf
    steps:
      - name: Reject invalid job IDs and missing secrets before CPU setup
        env:
          PRIVATE_TOKEN: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          JOB_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'Invalid opaque job ID'; exit 1; }
          test -n "$PRIVATE_TOKEN" || { echo 'Missing VOICE_ENGINE_REPO_TOKEN'; exit 1; }
          test -n "$JOB_KEY" || { echo 'Missing FF_JOB_FERNET_KEY'; exit 1; }
      - name: Check out pinned PRIVATE Voice Engine worker
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/voice-engine
          ref: 508d616455f2f3ef1d6629da449e304a6adce913
          token: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          path: engine_code
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            scripts
      - name: Check out encrypted Voice Engine inputs (do not execute staged content)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/voice-engine
          ref: main
          token: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          path: engine_data
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            jobs
      - name: Verify encrypted job exists
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          test -s "engine_data/jobs/${JOB_ID}/input.bundle.b64" || { echo 'Encrypted private job unavailable'; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install full-precision Qwen3-TTS 1.7B CPU dependencies
        timeout-minutes: 18
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install qwen-tts soundfile numpy cryptography
      - name: Generate two RU samples and send encrypted result ONLY to private repo
        timeout-minutes: 68
        env:
          VOICE_ENGINE_REPO_TOKEN: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          FF_JOB_FERNET_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          JOB_ID: ${{ inputs.job_id }}
          PYTHONPATH: ${{ github.workspace }}/engine_code
        shell: bash
        run: |
          set -euo pipefail
          # Upstream TTS and model logs may echo sensitive prompts. Suppress all
          # output; only report sanitized success/failure from the shell.
          if python engine_code/scripts/private_worker.py --job-id "$JOB_ID" --private-root engine_data >/dev/null 2>&1; then
            echo 'Full Qwen3-TTS 1.7B completed; encrypted result stored in PRIVATE release'
          else
            echo 'Private FF Qwen job failed. No personal data or results were published.'
            exit 1
          fi
      - name: Remove private input and model scratch from runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf engine_data engine_code "${RUNNER_TEMP}/ff-hf"