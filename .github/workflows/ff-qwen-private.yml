name: FF Qwen3 1.7B - private Voice Engine job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Opaque 32-character hex job ID only; never paste personal data'
        required: true
        type: string

# This PUBLIC repository may run trusted PRIVATE code, but may not write to itself.
permissions: {}
concurrency:
  group: ff-qwen-private-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  voice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HOME: /tmp/ff-hf
    steps:
      - name: Validate job ID and required secrets before model setup
        env:
          PRIVATE_TOKEN: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          JOB_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'Invalid opaque job ID'; exit 1; }
          test -n "$PRIVATE_TOKEN" || { echo 'Missing VOICE_ENGINE_REPO_TOKEN'; exit 1; }
          test -n "$JOB_KEY" || { echo 'Missing FF_JOB_FERNET_KEY'; exit 1; }

      - name: Check out pinned private Voice Engine code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/voice-engine
          ref: e75ba8375f11562b331f77855c8d536c7bed94cc
          token: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          path: private_code
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            scripts

      - name: Check out encrypted private job and encrypted owner profile
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tim8es/voice-engine
          ref: main
          token: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          path: private_data
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            jobs
            profiles

      - name: Verify private ciphertext exists
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          test -s "private_data/jobs/${JOB_ID}/input.bundle.b64" || { echo 'Encrypted private job unavailable'; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Preflight encrypted job and persistent voice profile
        timeout-minutes: 3
        env:
          FF_JOB_FERNET_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          JOB_ID: ${{ inputs.job_id }}
          PYTHONPATH: ${{ github.workspace }}/private_code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=43,<48'
          if python -m scripts.private_worker --preflight --job-id "$JOB_ID" --private-root private_data >/dev/null 2>&1; then
            echo 'Encrypted job and reusable private voice reference verified'
          else
            echo 'Encrypted voice profile unavailable or decryption failed; no model download attempted'
            exit 1
          fi

      - name: Install full-precision Qwen3-TTS 1.7B CPU dependencies
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          echo 'Checking FFmpeg availability'
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          echo 'Installing CPU PyTorch 2.8'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          echo 'Installing Qwen TTS dependencies'
          python -m pip install qwen-tts soundfile numpy cryptography

      - name: Generate private Russian voice comparison
        timeout-minutes: 68
        env:
          JOB_ID: ${{ inputs.job_id }}
          FF_VOICE_ENGINE_TOKEN: ${{ secrets.VOICE_ENGINE_REPO_TOKEN }}
          FF_JOB_FERNET_KEY: ${{ secrets.FF_JOB_FERNET_KEY }}
          PYTHONPATH: ${{ github.workspace }}/private_code
        shell: bash
        run: |
          set -euo pipefail
          # Inference packages may log transcripts. No model output goes to public logs.
          if python -m scripts.private_worker --job-id "$JOB_ID" --private-root private_data >/dev/null 2>&1; then
            echo 'Qwen3 1.7B completed; encrypted result stored in private Voice Engine release'
          else
            echo 'Private Voice Engine job failed. No personal data was published.'
            exit 1
          fi

      - name: Delete private files and model cache from runner
        if: always()
        shell: bash
        run: |
          rm -rf private_data private_code /tmp/ff-hf
